<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14110e">
<title>銃声の聴き比べ</title>
<style>
  :root {
    --bg: #14110e; --panel: #1d1914; --line: #4a3d2a; --gold: #c9a45c; --gold2: #e6c98a; --text: #e9e2d2; --dim: #9a8f7c; --on: #3a2f1c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, 'Segoe UI', 'Hiragino Sans', 'Yu Gothic UI', 'Meiryo', sans-serif; }
  body { padding: 0 16px 32px; -webkit-text-size-adjust: 100%; }
  main { max-width: 860px; margin: 0 auto; }
  #now { position: sticky; top: 0; z-index: 2; margin: 0 -16px 8px; padding: 12px 16px; background: var(--bg); border-bottom: 1px solid var(--line); font-size: 18px; font-weight: 700; color: var(--gold2); letter-spacing: 0.02em; line-height: 1.5; }
  #now small { display: block; font-size: 12px; font-weight: 400; color: var(--dim); }
  h1 { font-size: 15px; font-weight: 600; color: var(--dim); margin: 14px 0 4px; }
  section { margin: 14px 0; }
  h2 { font-size: 13px; font-weight: 600; color: var(--dim); margin: 0 0 6px; letter-spacing: 0.08em; }
  .row { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); }
  .row.v { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  @media (min-width: 720px) { .row.v { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
  button { appearance: none; font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; min-height: 48px; padding: 8px 10px; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  button:hover { border-color: var(--gold); }
  button:active { transform: translateY(1px); }
  button.on { background: var(--on); border-color: var(--gold); color: var(--gold2); }
  button.fire { font-size: 18px; font-weight: 700; min-height: 64px; border-color: var(--gold); }
  .vb { display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 64px; }
  .vb b { font-size: 22px; line-height: 1; }
  .vb span { font-size: 12px; color: var(--dim); }
  .vb.on span { color: var(--gold2); }
  .vol { display: flex; align-items: center; gap: 12px; }
  .vol input { flex: 1; min-width: 0; accent-color: var(--gold); height: 32px; }
  .vol output { width: 4.5em; text-align: right; font-weight: 700; color: var(--gold2); }
  #st { font-size: 12px; color: var(--dim); margin-top: 18px; }
</style>
</head>
<body>
<main>
  <div id="now" aria-live="polite"></div>
  <h1>銃声の聴き比べ</h1>
  <section>
    <h2>版</h2>
    <div class="row v" id="vers"></div>
  </section>
  <section>
    <h2>撃ち方</h2>
    <div class="row" id="modes"></div>
  </section>
  <section>
    <button class="fire" id="fire" style="width:100%">撃つ</button>
  </section>
  <section>
    <h2>場所</h2>
    <div class="row" id="places"></div>
  </section>
  <section>
    <h2>銃</h2>
    <div class="row" id="guns"></div>
  </section>
  <section>
    <h2>銃声の音量</h2>
    <div class="vol"><input type="range" id="vol" min="60" max="160" step="10" value="100" aria-label="銃声の音量"><output id="volv">100％</output></div>
  </section>
  <section>
    <h2>比べる用の音</h2>
    <div class="row" id="others"></div>
  </section>
  <div id="st">読み込み中</div>
</main>
<script src="js/util.js"></script>
<script src="js/sndbank.js"></script>
<script src="js/audio.js"></script>
<script>
(function () {
  'use strict';
  const A = G.sfx;
  // (this page's own state: nothing of it is saved, the game's settings are left as they are)
  G.save.data.settings.sound = 'new';
  A.volume = 0.8;
  const VERS = [[1, '今の版'], [2, '低い一発'], [3, '長い反響'], [4, '金属音'], [5, '録音が芯'], [6, '厚い胴鳴り']];
  const MODES = [['one', '単発'], ['three', '3発'], ['auto', '連射（1秒）']];
  const PLACES = [['in', '屋内'], ['out', '屋外']];
  const GUNS = [['rifle', 'アサルトライフル', 630, 'a_ranger'], ['pistol', '拳銃', 400, 'starter'], ['shotgun', '散弾銃', 72, 'g_breacher'], ['sniper', '狙撃銃', 46, 'n_scout']];
  const S = { v: 1, mode: 'one', place: 'in', gun: 'rifle', vol: 100, amb: true };
  const $ = (id) => document.getElementById(id);
  const label = (list, k) => (list.find((q) => q[0] === k) || [])[1];

  function setWorld() {
    const out = S.place === 'out';
    G.world = { mats: { biome: { outdoor: out } }, field: out ? 'battlefield' : 'catacombs' };
    if (A.applySet) A.applySet();
    if (A.setAmbience) A.setAmbience(S.amb ? 1 : 0);
  }
  let ready = false;
  function wake() {
    if (!ready) { setWorld(); A.init(); setWorld(); ready = true; }
    else A.init();
    A.setVolume(0.8);
  }
  // the game's own shot, the version picked: vol is the game's opts.vol (the shot's level goes as its 0.4th power)
  function shot() {
    const g = GUNS.find((q) => q[0] === S.gun);
    A.gunFlavor = S.v;
    A.gun(S.gun, { id: g[3], rar: 'common', vol: Math.pow(S.vol / 100, 2.5) });
  }
  let timers = [];
  function fire(mode) {
    wake();
    for (const t of timers) clearTimeout(t);
    timers = [];
    const g = GUNS.find((q) => q[0] === S.gun), dt = 60 / g[2], m = mode || S.mode;
    const n = m === 'one' ? 1 : m === 'three' ? 3 : Math.floor(1 / dt + 1e-6) + 1;
    shot();
    for (let i = 1; i < n; i++) timers.push(setTimeout(shot, i * dt * 1000));
  }
  function draw() {
    $('now').innerHTML = '版 ' + S.v + ' ' + label(VERS, S.v) + ' ／ ' + label(MODES, S.mode) + ' ／ ' + label(PLACES, S.place) + ' ／ 銃声 ' + S.vol + '％ ／ ' + label(GUNS, S.gun);
    for (const b of document.querySelectorAll('[data-k]')) b.classList.toggle('on', String(S[b.dataset.k]) === b.dataset.val);
    $('volv').textContent = S.vol + '％';
  }
  function btn(parent, k, val, html, cls, on) {
    const b = document.createElement('button');
    if (k) { b.dataset.k = k; b.dataset.val = String(val); }
    if (cls) b.className = cls;
    b.innerHTML = html;
    b.addEventListener('click', on);
    $(parent).appendChild(b);
    return b;
  }
  for (const [v, nm] of VERS) btn('vers', 'v', v, '<b>' + v + '</b><span>' + nm + '</span>', 'vb', () => { S.v = v; draw(); fire('one'); });
  for (const [m, nm] of MODES) btn('modes', 'mode', m, nm, '', () => { S.mode = m; draw(); fire(m); });
  for (const [p, nm] of PLACES) btn('places', 'place', p, nm, '', () => { S.place = p; draw(); wake(); setWorld(); });
  for (const [k, nm] of GUNS) btn('guns', 'gun', k, nm, '', () => { S.gun = k; draw(); fire('one'); });
  $('fire').addEventListener('click', () => fire());
  $('vol').addEventListener('input', (e) => { S.vol = +e.target.value; draw(); });
  $('vol').addEventListener('change', () => fire('one'));
  // what the shots stand among in the game: a few steps, being struck, a foe's voice ahead, a foe's gun off to the right, the place's own sound
  btn('others', '', '', '足音', '', () => { wake(); for (let i = 0; i < 4; i++) setTimeout(() => A.step('stone', 0.75), i * 420); });
  btn('others', '', '', '被弾', '', () => { wake(); A.hurt(20); });
  btn('others', '', '', '敵の声', '', () => { wake(); A.monster({ x: 0, y: 1.6, z: -9 }, 'snarl', 1, 1); });
  btn('others', '', '', '敵の銃声', '', () => { wake(); for (let i = 0; i < 4; i++) setTimeout(() => A.gun('smg', { vol: 0.6, pos: { x: 9, y: 1.5, z: -18 } }), i * 110); });
  btn('others', 'amb', true, '環境音', '', () => { S.amb = !S.amb; wake(); setWorld(); draw(); });
  document.addEventListener('keydown', (e) => {
    if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
    const n = +e.key;
    if (n >= 1 && n <= 6) { S.v = n; draw(); fire('one'); }
    else if (e.code === 'Space' && !/^(BUTTON|INPUT)$/.test(e.target.tagName)) { e.preventDefault(); fire(); }
  });
  draw();
  // (made now, while nothing can sound yet: the recordings are fetched and laid out before the first press)
  setWorld(); A.init(); setWorld(); ready = true;
  const st = setInterval(() => {
    const ok = A.samplesOn && A.samplesOn();
    $('st').textContent = ok ? '準備完了' : '読み込み中';
    if (ok) clearInterval(st);
  }, 300);
})();
</script>
</body>
</html>
