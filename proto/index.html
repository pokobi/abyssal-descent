<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>見た目の試作</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: system-ui, "Yu Gothic UI", sans-serif; color: #cfd3d6; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #load { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #07080a; z-index: 5; gap: 14px; }
  #load .bar { width: 280px; height: 3px; background: #1c2024; }
  #load .bar i { display: block; height: 100%; width: 0; background: #b9c4cc; transition: width .15s; }
  #load .msg { font-size: 13px; letter-spacing: .12em; opacity: .75; }
  #hud { position: fixed; left: 18px; bottom: 14px; font-size: 12px; line-height: 1.7; opacity: .62; pointer-events: none; text-shadow: 0 1px 2px #000; }
  #stat { position: fixed; right: 18px; top: 12px; font-size: 12px; opacity: .6; pointer-events: none; text-align: right; font-variant-numeric: tabular-nums; }
  #dot { position: fixed; left: 50%; top: 50%; width: 3px; height: 3px; margin: -1.5px; border-radius: 50%; background: #fff; opacity: .55; pointer-events: none; }
  #start { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 4; cursor: pointer; background: rgba(0,0,0,.35); font-size: 15px; letter-spacing: .2em; }
  body.clean #hud, body.clean #stat, body.clean #dot, body.clean #start { display: none !important; }
</style>
</head>
<body>
<div id="load"><div class="msg" id="lmsg">準備中</div><div class="bar"><i id="lbar"></i></div></div>
<div id="start">クリックで操作</div>
<div id="dot"></div>
<div id="stat"></div>
<div id="hud">WASD 移動 ／ Shift 走る ／ 左クリック 撃つ ／ 右クリック 構える ／ R 装填<br>1 後処理の入切 ／ 2 画質 ／ 3 敵を出し直す ／ Esc 解除</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script src="js/noise.js"></script>
<script src="js/bake.js"></script>
<script src="js/geo.js"></script>
<script src="js/sdf.js"></script>
<script src="js/mats.js"></script>
<script src="js/post.js"></script>
<script src="js/room.js"></script>
<script src="js/gun.js"></script>
<script src="js/hands.js"></script>
<script src="js/gunplay.js"></script>
<script src="js/monster.js"></script>
<script src="js/main.js"></script>
</body>
</html>
